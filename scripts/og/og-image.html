<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Today Learning 공유 이미지</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { width: 1200px; height: 630px; overflow: hidden; background: #F4F8FB; font-family: "Pretendard Variable", Pretendard, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
        .og-image { display: flex; align-items: center; justify-content: space-between; width: 1200px; height: 630px; padding: 0 80px; }
        .brand-copy { display: flex; flex-direction: column; gap: 24px; width: 524px; }
        .brand-mark { display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 12px; background: #36A9E3; color: #FFFFFF; font-size: 44px; font-weight: 700; line-height: 1; }
        .title { margin: 0; color: #13212E; font-size: 72px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; white-space: nowrap; }
        .description { width: 520px; margin: 0; color: #556678; font-size: 28px; font-weight: 400; line-height: 1.5; }
        .pattern { display: flex; flex-direction: column; gap: 8px; }
        .pattern-row { display: flex; gap: 8px; }
        .cell { width: 28px; height: 28px; border-radius: 4px; background: #E7EDF2; }
        .cell.is-accent { background: #1E8FCB; }
    </style>
</head>
<body>
    <main class="og-image">
        <div class="brand-copy">
            <div class="brand-mark" aria-hidden="true">T</div>
            <h1 class="title">Today Learning</h1>
            <p class="description">매일의 학습 내용을 TIL 원문과 쉬운 요약으로 읽는 개인 학습 노트입니다.</p>
        </div>
        <div class="pattern" aria-hidden="true">
            <div class="pattern-row"><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span></div>
            <div class="pattern-row"><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
            <div class="pattern-row"><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span></div>
            <div class="pattern-row"><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span></div>
            <div class="pattern-row"><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span></div>
            <div class="pattern-row"><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
            <div class="pattern-row"><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell is-accent"></span></div>
        </div>
    </main>
</body>
</html>

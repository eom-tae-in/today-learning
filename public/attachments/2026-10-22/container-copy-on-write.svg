<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 740" width="420" height="740" role="img" aria-labelledby="cow-title cow-desc">
  <title id="cow-title">공유 이미지는 그대로, 파일 변경은 컨테이너 A에만</title>
  <desc id="cow-desc">두 컨테이너는 같은 이미지의 index.html에서 Hello를 읽습니다. A가 파일을 수정하면 원본 파일을 A의 쓰기 계층으로 복사한 뒤 Study로 변경합니다. A는 Study를 읽지만 이미지와 B의 Hello는 유지됩니다. 16초마다 반복하는 설명용 애니메이션입니다.</desc>
  <defs>
    <marker id="read-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 6 4 L 1 7" fill="none" stroke="#8b9bb2" stroke-width="1.5"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#18283f" text-anchor="middle">
    <rect width="420" height="740" rx="20" fill="#f3f6fb"/>
    <text x="210" y="42" font-size="26" font-weight="700">공유 이미지, 개별 변경</text>
    <text x="210" y="73" font-size="18" fill="#50627c">index.html · 설명용 예시</text>

    <rect x="20" y="96" width="380" height="78" rx="14" fill="#e4edff"/>
    <g id="phase-read">
      <text x="210" y="127" font-size="18" fill="#375b9b">1 · 처음 상태</text>
      <text x="210" y="155" font-size="21" font-weight="700">같은 이미지에서 읽기</text>
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.25;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </g>
    <g id="phase-copy" opacity="0">
      <text x="210" y="127" font-size="18" fill="#375b9b">2 · A가 수정 시작</text>
      <text x="210" y="155" font-size="21" font-weight="700">A의 쓰기 계층으로 복사</text>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </g>
    <g id="phase-changed" opacity="0">
      <text x="210" y="127" font-size="18" fill="#375b9b">3 · 수정 후</text>
      <text x="210" y="155" font-size="21" font-weight="700">A만 Study로 변경</text>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </g>

    <rect x="20" y="195" width="180" height="267" rx="16" fill="#ffffff" stroke="#9ab5e8" stroke-width="2"/>
    <rect x="220" y="195" width="180" height="267" rx="16" fill="#ffffff" stroke="#c5cfdd" stroke-width="2"/>
    <text x="110" y="231" font-size="23" font-weight="700">컨테이너 A</text>
    <text x="310" y="231" font-size="23" font-weight="700">컨테이너 B</text>
    <text x="110" y="267" font-size="18" fill="#50627c">읽은 값</text>
    <text x="310" y="267" font-size="18" fill="#50627c">읽은 값</text>
    <text id="a-hello" x="110" y="307" font-size="31" font-weight="700" fill="#315786">Hello
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.5;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </text>
    <text id="a-study" x="110" y="307" font-size="31" font-weight="700" fill="#12644c" opacity="0">Study
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </text>
    <text id="b-value" x="310" y="307" font-size="31" font-weight="700" fill="#315786">Hello</text>

    <rect x="31" y="331" width="158" height="115" rx="10" fill="#edf4ff"/>
    <rect x="231" y="331" width="158" height="115" rx="10" fill="#f1f4f8"/>
    <text x="110" y="360" font-size="18" fill="#50627c">쓰기 계층</text>
    <text x="310" y="360" font-size="18" fill="#50627c">쓰기 계층</text>
    <text id="a-empty" x="110" y="410" font-size="20" fill="#50627c">변경 없음
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.25;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="310" y="410" font-size="20" fill="#50627c">변경 없음</text>
    <g id="a-written" opacity="0">
      <rect x="50" y="377" width="120" height="50" rx="9" fill="#d8f3e6" stroke="#3c9170"/>
      <text x="110" y="410" font-size="24" font-weight="700" fill="#12644c">Study</text>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </g>

    <path d="M 110 533 L 110 477" fill="none" stroke="#8b9bb2" stroke-width="2" marker-end="url(#read-arrow)"/>
    <path d="M 310 533 L 310 477" fill="none" stroke="#8b9bb2" stroke-width="2" marker-end="url(#read-arrow)"/>
    <rect x="20" y="541" width="380" height="130" rx="16" fill="#e8edf5" stroke="#bdc9db"/>
    <text x="210" y="573" font-size="22" font-weight="700">공유 이미지 · 읽기 전용</text>
    <text x="102" y="623" font-size="19" fill="#50627c">index.html</text>
    <rect x="218" y="590" width="150" height="51" rx="9" fill="#ffffff" stroke="#b7c8e0"/>
    <text id="image-value" x="293" y="624" font-size="25" font-weight="700" fill="#315786">Hello</text>

    <g id="copied-file" opacity="0">
      <rect x="233" y="590" width="120" height="50" rx="9" fill="#dce9ff" stroke="#4e7bbf" stroke-width="2"/>
      <text x="293" y="623" font-size="24" font-weight="700" fill="#315786">Hello</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-183 -213;-183 -213;-183 -213" keyTimes="0;0.25;0.4375;0.5;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </g>
    <text x="210" y="705" font-size="20" font-weight="700">변경분은 A에만 저장</text>
    <text x="210" y="730" font-size="17" fill="#50627c">이미지와 B의 Hello는 유지</text>
  </g>
</svg>

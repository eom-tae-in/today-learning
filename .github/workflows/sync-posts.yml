name: Update posts.json

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Record date in YYYY-MM-DD"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "TLP/**/*.md"
      - "TIL/**/*.md"

permissions:
  contents: write

jobs:
  update-posts:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 2

      - name: Checkout prod
        uses: actions/checkout@v4
        with:
          ref: prod
          path: prod
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Update posts.json
        working-directory: main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_DATE: ${{ github.event.inputs.date || '' }}
        run: node scripts/github/main.js

      - name: Commit generated records to main
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json
          if [ -d Reviews ]; then
            git add -A Reviews
          fi

          if git diff --cached --quiet; then
            echo "No generated main changes"
            exit 0
          fi

          git commit -m "chore: sync generated learning records"
          git push origin main

      - name: Sync record files
        run: |
          mkdir -p prod/TLP
          mkdir -p prod/TIL
          mkdir -p prod/Reviews
          if [ -d main/TLP ]; then
            rsync -a --delete main/TLP/ prod/TLP/
          else
            rm -rf prod/TLP/*
          fi
          rsync -a --delete main/TIL/ prod/TIL/
          if [ -d main/Reviews ]; then
            rsync -a --delete main/Reviews/ prod/Reviews/
          else
            rm -rf prod/Reviews/*
          fi
          cp main/posts.json prod/posts.json

      - name: Commit & Push
        working-directory: prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json
          git add TLP
          git add TIL
          git add -A Reviews

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "deploy: sync daily records"
          git push origin prod

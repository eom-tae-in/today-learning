name: Update posts.json

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Record date in YYYY-MM-DD"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "TLP/**/*.md"
      - "TIL/**/*.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-posts:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Update posts.json
        working-directory: main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_DATE: ${{ github.event.inputs.date || '' }}
        run: node scripts/github/main.js

      - name: Commit generated records to main
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json
          if [ -d Reviews ]; then
            git add -A Reviews
          fi

          if git diff --cached --quiet; then
            echo "No generated main changes"
            exit 0
          fi

          git commit -m "chore: sync generated learning records"
          git push origin main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
